<script>
// Snap scroll functionality
let isScrolling = false;
let currentPage = 1;
const totalPages = 5;
let bgMusic;
// MÜZİK
function playLoveSong() {
  const song = document.getElementById('loveSong');
  if (song.paused) {
    song.play();
    document.getElementById('playButton').innerHTML = '⏸️';  // Oynuyorsa durdur simgesi
  } else {
    song.pause();
    document.getElementById('playButton').innerHTML = '▶️';  // Durdurulduysa oynat simgesi
  }
}
// Başlangıç tarihini buraya girin (Örnek: 2020-01-01)
const startDate = new Date('2024-12-02T23:55:00'); 
// Sayaç için fonksiyon
function updateCounter() {
  const now = new Date();
  const diff = now - startDate;
    
  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
  const seconds = Math.floor((diff % (1000 * 60)) / 1000);
    
  const counterText = `${days} gün ${hours} saat ${minutes} dakika ${seconds} saniye`;
  document.getElementById("counterText").innerText = `${counterText}`;
}

// Sayaç her saniye güncellenecek
setInterval(updateCounter, 1000);
// Initialize background music
function initBackgroundMusic() {
bgMusic = new Audio('https://public.readdy.ai/gen_page/romantic_background_music.mp3');
bgMusic.loop = true;
bgMusic.volume = 0.5;
// Auto play music when page loads
playMusic();
// Add one-time click event to start music (needed for mobile)
document.body.addEventListener('click', function startMusic() {
playMusic();
document.body.removeEventListener('click', startMusic);
}, { once: true });
}
function toggleMusic() {
if (bgMusic.paused) {
playMusic();
} else {
bgMusic.play();
}
}
function playMusic() {
bgMusic.play().catch(err => {
console.log('Playback prevented by browser', err);
// Try again with user interaction
document.addEventListener('click', function playOnInteraction() {
bgMusic.play().then(() => {
document.removeEventListener('click', playOnInteraction);
});
}, { once: true });
});
}
function scrollToPage(pageNumber) {
if (pageNumber < 1 || pageNumber > totalPages || isScrolling) return;
isScrolling = true;
currentPage = pageNumber;
const targetElement = document.getElementById(`page${pageNumber}`);
if (targetElement) {
targetElement.scrollIntoView({
behavior: 'smooth',
block: 'start'
});
setTimeout(() => {
isScrolling = false;
}, 800);
}
}
// Handle scroll events
window.addEventListener('wheel', (e) => {
if (isScrolling) return;
if (e.deltaY > 0) {
// Scrolling down
scrollToPage(currentPage + 1);
} else {
// Scrolling up
scrollToPage(currentPage - 1);
}
});
// Handle touch events for mobile
let touchStartY = 0;
let touchEndY = 0;
window.addEventListener('touchstart', (e) => {
touchStartY = e.changedTouches[0].screenY;
});
window.addEventListener('touchend', (e) => {
if (isScrolling) return;
touchEndY = e.changedTouches[0].screenY;
const diffY = touchStartY - touchEndY;
// Threshold for swipe detection
if (Math.abs(diffY) > 50) {
if (diffY > 0) {
// Swipe up (go down)
scrollToPage(currentPage + 1);
} else {
// Swipe down (go up)
scrollToPage(currentPage - 1);
}
}
});
// Button click handlers still work
document.querySelectorAll('a[href^="#"]').forEach(anchor => {
anchor.addEventListener('click', function(e) {
e.preventDefault();
const targetId = this.getAttribute('href');
const pageNumber = parseInt(targetId.replace('#page', ''));
if (!isNaN(pageNumber)) {
scrollToPage(pageNumber);
}
});
});
// Initialize music when DOM is loaded
document.addEventListener('DOMContentLoaded', function() {
initBackgroundMusic();
// Try to autoplay music immediately
setTimeout(playMusic, 500);
});
</script>
